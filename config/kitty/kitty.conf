# -----------------------------------------------------------------------------
# Kitty - configuracion personal de Chris
# -----------------------------------------------------------------------------

# Fuente y aspecto
font_family      JetBrainsMono Nerd Font Mono
font_size        12.0
cursor_shape     beam
cursor_beam_thickness 1.5
window_padding_width 12
scrollback_lines 10000

# Transparencia suave (el blur lo aplica Hyprland)
background_opacity 0.82
dynamic_background_opacity yes

# -----------------------------------------------------------------------------
# Portapapeles estilo Windows
# -----------------------------------------------------------------------------

# Copiar automaticamente al seleccionar y soltar
copy_on_select clipboard
clear_selection_on_clipboard_loss yes

# Click derecho: pegar el contenido del portapapeles
mouse_map right press ungrabbed paste_from_clipboard

# Ctrl+C: copia si hay seleccion, si no envia SIGINT (interrumpir)
map ctrl+c copy_and_clear_or_interrupt

# Ctrl+V: pegar
map ctrl+v paste_from_clipboard

# Ctrl+X: copiar y limpiar la seleccion (cortar)
map ctrl+x combine : copy_to_clipboard : clear_selection

